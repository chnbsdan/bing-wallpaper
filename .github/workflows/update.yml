name: 每日更新壁纸

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ★★★ 安装 sharp 系统依赖 ★★★
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev libglib2.0-dev

      - name: 安装 Node 依赖
        run: |
          npm install
          npm rebuild sharp
          # 验证 sharp 是否可用
          node -e "try { require('sharp'); console.log('✅ sharp 可用'); } catch(e) { console.error('❌ sharp 不可用:', e.message); process.exit(1); }"

      - name: 抓取壁纸
        id: fetch
        run: |
          echo "开始抓取壁纸..."
          npm run fetch 2>&1 | tee fetch.log
          
          if git status --porcelain | grep -qE '(picture|webp|data|urls\.txt|copyrights\.txt)'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ 有新的壁纸需要提交"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "📭 没有新的壁纸"
          fi
        continue-on-error: true

      - name: 显示日志
        if: always()
        run: |
          echo "=== 抓取日志 ==="
          cat fetch.log || echo "无日志"
          echo ""
          echo "=== Git 状态 ==="
          git status

      - name: 提交并推送
        if: steps.fetch.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase --no-edit || true
          git add picture/ webp/ data/ urls.txt copyrights.txt 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "没有新壁纸需要提交"
            exit 0
          fi
          
          git commit -m "🖼️ 自动更新壁纸 $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
          echo "✅ 推送成功！"
