name: 每日更新壁纸

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 4 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          npm install
          echo "✅ 依赖安装完成"

      - name: 抓取壁纸
        id: fetch
        run: |
          echo "开始抓取壁纸..."
          npm run fetch 2>&1 | tee fetch.log
          
          if git status --porcelain | grep -qE '(picture|data|urls\.txt|copyrights\.txt)'; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ 有新的壁纸需要提交"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "📭 没有新的壁纸"
          fi

      # ★★★ 强制重新生成分页（即使没有新壁纸） ★★★
      - name: 强制重新生成分页
        run: |
          echo "🔄 强制重新生成分页..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const DATA_FILE = './data/wallpapers.json';
            const PAGES_DIR = './data/pages';
            const PAGE_SIZE = 42;
            
            if (!fs.existsSync(DATA_FILE)) {
              console.log('❌ wallpapers.json 不存在');
              process.exit(0);
            }
            
            const data = JSON.parse(fs.readFileSync(DATA_FILE, 'utf-8'));
            
            // 清空 pages 目录
            if (fs.existsSync(PAGES_DIR)) {
              const files = fs.readdirSync(PAGES_DIR);
              files.forEach(f => {
                if (f.endsWith('.json')) {
                  fs.unlinkSync(path.join(PAGES_DIR, f));
                }
              });
            } else {
              fs.mkdirSync(PAGES_DIR, { recursive: true });
            }
            
            const totalPages = Math.ceil(data.length / PAGE_SIZE);
            console.log(\`📄 生成 \${totalPages} 个分页文件\`);
            
            for (let i = 0; i < totalPages; i++) {
              const start = i * PAGE_SIZE;
              const end = Math.min(start + PAGE_SIZE, data.length);
              const pageData = {
                items: data.slice(start, end),
                page: i + 1,
                pageSize: PAGE_SIZE,
                total: data.length,
                totalPages: totalPages,
                hasMore: i + 1 < totalPages
              };
              fs.writeFileSync(
                path.join(PAGES_DIR, \`page-\${i + 1}.json\`),
                JSON.stringify(pageData, null, 2)
              );
            }
            console.log('✅ 分页重新生成完成');
          "

      - name: 显示日志
        if: always()
        run: |
          echo "=== 抓取日志 ==="
          cat fetch.log || echo "无日志"
          echo ""
          echo "=== 分页文件列表 ==="
          ls -la data/pages/ || echo "pages 目录不存在"
          echo ""
          echo "=== Git 状态 ==="
          git status

      - name: 提交并推送
        if: steps.fetch.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git pull origin main --rebase --no-edit || true
          git add picture/ data/ urls.txt copyrights.txt 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "没有新壁纸需要提交"
            exit 0
          fi
          
          git commit -m "🖼️ 自动更新壁纸 $(date +'%Y-%m-%d %H:%M:%S')"
          git push origin main
          echo "✅ 推送成功！"
