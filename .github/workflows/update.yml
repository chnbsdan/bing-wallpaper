name: 每日更新壁纸

on:
  schedule:
    # 北京时间 8:00, 12:00, 17:00, 21:00 各抓一次
    - cron: '0 0 * * *'   # UTC 0:00 = 北京时间 8:00
    - cron: '0 4 * * *'   # UTC 4:00 = 北京时间 12:00
    - cron: '0 9 * * *'   # UTC 9:00 = 北京时间 17:00
    - cron: '0 13 * * *'  # UTC 13:00 = 北京时间 21:00
  workflow_dispatch:      # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # 获取完整历史，避免冲突

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: npm install

      - name: 抓取壁纸
        id: fetch
        run: |
          npm run fetch 2>&1 | tee fetch.log
          # 检查是否有新壁纸
          if git status --porcelain | grep -q .; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: 显示抓取日志（调试用）
        if: always()
        run: cat fetch.log || echo "无日志"

      - name: 提交并推送
        if: steps.fetch.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 先拉取最新代码，避免冲突
          git pull origin main --rebase || true
          
          git add picture/ webp/ data/ urls.txt copyrights.txt 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "没有新壁纸需要提交"
          else
            git commit -m "🖼️ 自动更新壁纸 $(date +'%Y-%m-%d %H:%M')"
            git push origin main
          fi

      - name: 如果抓取失败，发送通知（可选）
        if: failure()
        run: |
          echo "⚠️ 壁纸抓取失败，请检查"
          # 如果需要通知，可以配置 Telegram/Bark 等
