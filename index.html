<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>必应壁纸</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
    <!-- 进度条 -->
    <div id="progress-bar"></div>

    <!-- 导航栏 -->
    <button class="nav-toggle" id="navToggle" aria-label="切换导航"><i class="fas fa-bars"></i></button>
    <div class="navbar" id="navbar">
        <div class="navbar-header">
            <div class="logo"><img src="/favicon.ico" alt="Logo" style="width:24px;height:24px;border-radius:4px;" /> Bing <span>Wallpaper</span></div>
        </div>
        <div class="badge"><i class="fas fa-images"></i> <span id="totalNavCount">0</span> 张</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜索年份/关键词..." />
            <button class="search-btn" id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
        <div class="nav-actions">
            <button id="homeBtn"><i class="fas fa-home"></i> 首页</button>
            <a href="/api" target="_blank"><i class="fas fa-code"></i> API</a>
            <a href="https://aoso.hangdn.com" target="_blank" rel="noopener"><i class="fas fa-blog"></i> 博客</a>
            <button id="themeToggle"><i class="fas fa-moon"></i></button>
        </div>
    </div>

    <!-- 应用 -->
    <div class="app">
        <div class="grid" id="grid"></div>
    </div>

    <!-- 分页 -->
    <div class="pagination" id="pagination">
        <button id="prevBtn" disabled><i class="fas fa-chevron-left"></i> 上一页</button>
        <span class="page-info" id="pageInfo">第 1 / 1 页</span>
        <span class="total-info" id="totalInfo"><i class="fas fa-images"></i> 共 0 张</span>
        <button id="nextBtn">下一页 <i class="fas fa-chevron-right"></i></button>
        <div class="goto-box">
            <input type="number" id="gotoInput" min="1" placeholder="页" />
            <button class="goto-btn" id="gotoBtn"><i class="fas fa-arrow-right"></i> 跳转</button>
        </div>
    </div>

    <!-- 大图预览 -->
    <div class="overlay" id="overlay">
        <div class="image-container" id="imageContainer">
            <img class="preview-image" id="previewImg" src="" alt="预览" />
        </div>
        <button class="arrow arrow-left" id="prevPreviewBtn"><i class="fas fa-chevron-left"></i></button>
        <button class="arrow arrow-right" id="nextPreviewBtn"><i class="fas fa-chevron-right"></i></button>
        <div class="action-buttons">
            <button class="btn-download" id="downloadBtn"><i class="fas fa-download"></i> 下载</button>
            <button class="btn-detail" id="detailBtn"><i class="fas fa-circle-info"></i> 详情</button>
            <button class="btn-close" id="closeBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="meta" id="previewMeta">
            <span id="previewTitle"></span>
            <span class="date" id="previewDate"></span>
        </div>
        <div class="detail-overlay" id="detailOverlay"></div>
        <div class="detail-panel" id="detailPanel">
            <div class="detail-panel-header"><h2><i class="fas fa-circle-info"></i> 图片详情</h2><button class="detail-panel-close" id="detailPanelClose"><i class="fas fa-times"></i></button></div>
            <div class="detail-panel-body">
                <div class="detail-item"><span class="detail-label"><i class="fas fa-calendar-day"></i> 日期</span><span class="detail-value" id="detailDate">-</span></div>
                <div class="detail-item"><span class="detail-label"><i class="fas fa-tag"></i> 标题</span><span class="detail-value" id="detailTitle">-</span></div>
                <div class="detail-item"><span class="detail-label"><i class="fas fa-copyright"></i> 版权</span><span class="detail-value" id="detailCopyright">-</span></div>
                <div class="detail-item"><span class="detail-label"><i class="fas fa-globe"></i> 地区</span><span class="detail-value" id="detailLocale">-</span></div>
                <div class="detail-item"><span class="detail-label"><i class="fas fa-image"></i> 分辨率</span><span class="detail-value" id="detailResolution">1920 x 1080</span></div>
                <div class="detail-item" style="border-bottom: none; padding-top: 8px; padding-bottom: 4px;">
                    <span class="detail-value" style="font-size: 14px; color: var(--text-secondary); opacity: 0.6; user-select: none;">
                        <i class="fas fa-shield-alt" style="margin-right: 6px; color: var(--accent-color); opacity: 0.4;"></i>本站仅聚合 Bing 官方壁纸链接，图片版权归微软及原作者所有。
                    </span>
                </div>
                <div class="detail-item"><span class="detail-label"><i class="fas fa-link"></i> 原图链接</span><span class="detail-value"><a href="#" id="detailLink" target="_blank"><i class="fas fa-external-link-alt"></i> 打开原图</a></span></div>
            </div>
        </div>
    </div>

    <!-- 分辨率选择面板 -->
    <div class="resolution-overlay" id="resolutionOverlay"></div>
    <div class="resolution-panel" id="resolutionPanel">
        <div class="resolution-header">
            <span><i class="fas fa-download"></i> 选择分辨率</span>
            <button class="resolution-close" id="resolutionClose"><i class="fas fa-times"></i></button>
        </div>
        <div class="resolution-body">
            <div class="resolution-section">
                <div class="resolution-label">横屏</div>
                <div class="resolution-grid">
                    <button class="resolution-btn" data-width="3840" data-height="2160">UHD (4K)</button>
                    <button class="resolution-btn" data-width="1920" data-height="1200">1920×1200</button>
                    <button class="resolution-btn" data-width="1920" data-height="1080">1920×1080</button>
                    <button class="resolution-btn" data-width="1366" data-height="768">1366×768</button>
                    <button class="resolution-btn" data-width="1024" data-height="768">1024×768</button>
                </div>
            </div>
            <div class="resolution-section">
                <div class="resolution-label">竖屏 / 手机</div>
                <div class="resolution-grid">
                    <button class="resolution-btn" data-width="1080" data-height="1920">1080×1920</button>
                    <button class="resolution-btn" data-width="768" data-height="1280">768×1280</button>
                    <button class="resolution-btn" data-width="720" data-height="1280">720×1280</button>
                    <button class="resolution-btn" data-width="480" data-height="800">480×800</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/theme.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/render.js"></script>
    <script src="/js/preview.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
